controller:
  JCasC:
    configScripts:
      casc-managed.yaml: |-
        jenkins:
          securityRealm:
            github:
              clientID: "${GITHUB_OAUTH_CLIENT_ID}"
              clientSecret: "${GITHUB_OAUTH_CLIENT_SECRET}"
              githubWebUri: "https://github.com"
              githubApiUri: "https://api.github.com"
              oauthScopes: "read:org,user:email"
          authorizationStrategy:
            projectMatrix:
              permissions:
                - "Overall/Administer:derekpedersen"
                - "Overall/Read:authenticated"
                - "Job/Read:authenticated"
                - "View/Read:authenticated"
          clouds:
          - kubernetes:
              name: "kubernetes"
              namespace: "jenkins"
              webSocket: true
              templates:
              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-jenkins-golang:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  resourceLimitCpu: ".5"
                  resourceLimitMemory: "512Mi"
                  resourceRequestCpu: ".025"
                  resourceRequestMemory: "128Mi"
                  workingDir: "/home/jenkins"
                  envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://127.0.0.1:2375"
                - alwaysPullImage: true
                  envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
                  image: "docker:29-dind"
                  name: "docker"
                  privileged: true
                  resourceLimitCpu: "1"
                  resourceLimitMemory: "768Mi"
                  resourceRequestCpu: ".05"
                  resourceRequestMemory: "192Mi"
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                id: "e4a18b6c-8e74-498c-adad-53d145c92728"
                idleMinutes: 15
                instanceCap: 1
                label: "build-jenkins-golang || build-golang || build-golang-stable"
                name: "golang"
                nodeUsageMode: "NORMAL"
                podRetention: "onFailure"
                serviceAccount: "default"
                slaveConnectTimeout: 600
                yamlMergeStrategy: "override"

              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-jenkins-node:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  resourceLimitCpu: ".5"
                  resourceLimitMemory: "512Mi"
                  resourceRequestCpu: ".025"
                  resourceRequestMemory: "128Mi"
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                  envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://127.0.0.1:2375"
                - alwaysPullImage: true
                  envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
                  image: "docker:29-dind"
                  name: "docker"
                  privileged: true
                  resourceLimitCpu: "1"
                  resourceLimitMemory: "768Mi"
                  resourceRequestCpu: ".05"
                  resourceRequestMemory: "192Mi"
