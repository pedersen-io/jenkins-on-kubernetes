controller:
  replicas: 1
  serviceType: ClusterIP
  agentListenerEnabled: false

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - git-client
    - github
  installLatestPlugins: true
  initializeOnce: true

  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  probes:
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 10
    livenessProbe:
      failureThreshold: 8
      periodSeconds: 15
      timeoutSeconds: 10
    readinessProbe:
      failureThreshold: 6
      periodSeconds: 10
      timeoutSeconds: 10

  ingress:
    enabled: true
    ingressClassName: nginx
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hostName: jenkins.pedersen.io
    path: /
    pathType: ImplementationSpecific
    tls:
      - secretName: jenkins-pedersen-io-tls
        hosts:
          - jenkins.pedersen.io

  JCasC:
    configScripts:
      casc-managed.yaml: |-
        jenkins:
          clouds:
          - kubernetes:
              name: "kubernetes"
              namespace: "jenkins"
              webSocket: true
              templates:
              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-golang:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  resourceLimitCpu: ".5"
                  resourceLimitMemory: "512Mi"
                  resourceRequestCpu: ".1"
                  resourceRequestMemory: "512Mi"
                  workingDir: "/home/jenkins"
                  envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://127.0.0.1:2375"
                - alwaysPullImage: true
                  envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
                  image: "docker:29-dind"
                  name: "docker"
                  privileged: true
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                id: "e4a18b6c-8e74-498c-adad-53d145c92728"
                idleMinutes: 15
                instanceCap: 5
                label: "build-golang-stable"
                name: "golang"
                nodeUsageMode: "NORMAL"
                podRetention: "onFailure"
                serviceAccount: "default"
                slaveConnectTimeout: 600
                yamlMergeStrategy: "override"

              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-node:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                  envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://127.0.0.1:2375"
                - alwaysPullImage: true
                  envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
                  image: "docker:29-dind"
                  name: "docker"
                  privileged: true
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                id: "6170664b-ab08-46ae-a41d-a2721b714a12"
                idleMinutes: 15
                instanceCap: 5
                label: "build-node-stable"
                name: "node"
                podRetention: "onFailure"
                slaveConnectTimeout: 600
                yamlMergeStrategy: "override"

              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-jenkins-base:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  ttyEnabled: true
                  workingDir: "/home/jenkins/agent"
                  envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://127.0.0.1:2375"
                - alwaysPullImage: true
                  envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
                  image: "docker:29-dind"
                  name: "docker"
                  privileged: true
                  ttyEnabled: true
                  workingDir: "/home/jenkins/agent"
                id: "02b8986f-3c2b-46a9-9b2a-00ba2e83cc4e"
                idleMinutes: 15
                instanceCap: 5
                label: "build-base-stable"
                name: "jenkins"
                podRetention: "onFailure"
                slaveConnectTimeout: 600
                yamlMergeStrategy: "override"

              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-dotnetcore:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                  envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://127.0.0.1:2375"
                - alwaysPullImage: true
                  envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
                  image: "docker:29-dind"
                  name: "docker"
                  privileged: true
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                id: "6170664b-ab08-46ae-a41d-a2721b714a12"
                idleMinutes: 15
                instanceCap: 5
                label: "build-dotnetcore-stable"
                name: "dotnetcore"
                podRetention: "onFailure"
                slaveConnectTimeout: 600
                yamlMergeStrategy: "override"

  imagePullSecrets:
    - name: regcred

persistence:
  enabled: true
  size: 8Gi

  