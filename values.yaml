controller:
  replicas: 1
  serviceType: ClusterIP
  agentListenerEnabled: false

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - git-client
    - github
    - github-oauth
    - matrix-auth
  installLatestPlugins: true
  initializeOnce: true

  containerEnv:
    - name: GITHUB_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: jenkins-github-oauth
          key: client-id
    - name: GITHUB_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: jenkins-github-oauth
          key: client-secret

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  probes:
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 10
    livenessProbe:
      failureThreshold: 8
      periodSeconds: 15
      timeoutSeconds: 10
    readinessProbe:
      failureThreshold: 6
      periodSeconds: 10
      timeoutSeconds: 10

  ingress:
    enabled: true
    ingressClassName: nginx
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hostName: jenkins.pedersen.io
    path: /
    pathType: ImplementationSpecific
    tls:
      - secretName: jenkins-pedersen-io-tls
        hosts:
          - jenkins.pedersen.io
