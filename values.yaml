controller:
  serviceType: LoadBalancer

  ingress:
    enabled: true
    ingressClassName: nginx
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "letsencrypt-prod"

    hostName: jenkins.pedersen.io
    path: /
    pathType: ImplementationSpecific

    tls:
      - secretName: jenkins-pedersen-io-tls
        hosts:
          - jenkins.pedersen.io

  env:
    - name: CASC_JENKINS_CONFIG
      value: /var/jenkins_config/jenkins-casc.yaml

  additionalVolumes:
    - name: jenkins-casc-volume
      configMap:
        name: jenkins-casc
        items:
          - key: jenkins-casc.yaml
            path: jenkins-casc.yaml

  additionalVolumeMounts:
    - name: jenkins-casc-volume
      mountPath: /var/jenkins_config
      readOnly: true

  imagePullSecrets:
    - name: regcred

persistence:
  enabled: true
  size: 8Gi