controller:
  replicas: 1
  serviceType: ClusterIP
  agentListenerEnabled: false

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - git-client
    - github
  installLatestPlugins: true
  initializeOnce: true

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  probes:
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 10
    livenessProbe:
      failureThreshold: 8
      periodSeconds: 15
      timeoutSeconds: 10
    readinessProbe:
      failureThreshold: 6
      periodSeconds: 10
      timeoutSeconds: 10

  ingress:
    enabled: true
    ingressClassName: nginx
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hostName: jenkins.pedersen.io
    path: /
    pathType: ImplementationSpecific
    tls:
      - secretName: jenkins-pedersen-io-tls
        hosts:
          - jenkins.pedersen.io

  JCasC:
    configScripts:
      casc-managed.yaml: |-
        jenkins:
          clouds:
          - kubernetes:
              name: "kubernetes"
              namespace: "jenkins"
              webSocket: true
              templates:
              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-jenkins-golang:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  resourceLimitCpu: ".5"
                  resourceLimitMemory: "512Mi"
                  resourceRequestCpu: ".025"
                  resourceRequestMemory: "128Mi"
                  workingDir: "/home/jenkins"
                  envVars:
                  - envVar:
                      key: "DOCKER_HOST"
                      value: "tcp://127.0.0.1:2375"
                - alwaysPullImage: true
                  envVars:
                  - envVar:
                      key: "DOCKER_TLS_CERTDIR"
                      value: ""
                  image: "docker:29-dind"
                  name: "docker"
                  privileged: true
                  resourceLimitCpu: "1"
                  resourceLimitMemory: "768Mi"
                  resourceRequestCpu: ".05"
                  resourceRequestMemory: "192Mi"
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                id: "e4a18b6c-8e74-498c-adad-53d145c92728"
                idleMinutes: 15
                instanceCap: 1
                label: "build-jenkins-golang"
                name: "golang"
                nodeUsageMode: "NORMAL"
                podRetention: "onFailure"
                serviceAccount: "default"
                slaveConnectTimeout: 600
                yamlMergeStrategy: "override"

              - containers:
                - alwaysPullImage: true
                  args: "^${computer.jnlpmac} ^${computer.name}"
                  image: "derekpedersen/build-jenkins-node:latest"
                  livenessProbe:
                    failureThreshold: 0
                    initialDelaySeconds: 0
                    periodSeconds: 0
                    successThreshold: 0
                    timeoutSeconds: 0
                  name: "jnlp"
                  resourceLimitCpu: ".5"
                  resourceLimitMemory: "512Mi"
                  resourceRequestCpu: ".025"
                  resourceRequestMemory: "128Mi"
                  ttyEnabled: true
                  workingDir: "/home/jenkins"
                  envVars:
